<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>formé</title>
<meta name="description" content="formé is a showroom for iconic design: the lamps, chairs and objects that shaped design history, and the stories behind them.">
<meta name="theme-color" content="#F5F2EC">
<meta property="og:site_name" content="formé">
<meta property="og:title" content="formé">
<meta property="og:description" content="The stories behind iconic design.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
<script defer src="/assets/data.js"></script>
<script defer src="/assets/views.js"></script>
<script defer src="/assets/app.bundle.js"></script>
<noscript><style>.plate img.ph { opacity: 1; } .plate:has(> img.ph)::after { display: none; }</style></noscript>
</head>
<body>
<div class="app">
<a class="skip" href="#swup">Skip to content</a>
<header class="header nav transition-swup{{home}}" id="nav">
  <div class="wrap nav-in" style="padding-left: var(--gl)">
    <a href="/" class="brand" data-go="home" aria-label="formé, home" translate="no">formé</a>
    <nav class="navlinks" aria-label="Main">
      <a href="/collection/lighting" data-go="collection:lighting">Lighting</a>
      <a href="/collection/furniture" data-go="collection:furniture">Furniture</a>
      <a href="/collection/objects" data-go="collection:objects">Objects</a>
      <a href="/stories" data-go="stories">Stories</a>
      <a href="/designers" data-go="designers">Designers</a>
      <a href="/about" data-go="about">About</a>
    </nav>
    <div class="nav-sp"></div>
    <div class="slot">
      <button class="icon-btn burger" id="openMenu" aria-label="Open menu"><span></span><span></span></button>
      <button class="cancel" id="closeSearch" tabindex="-1">Cancel</button>
    </div>
    <div class="sfield" id="sfield">
      <span class="sframe sq" aria-hidden="true"></span>
      <span class="sicon" id="sicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg></span>
      <label for="q" class="sr">Search formé</label>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Lamps, chairs, designers…" tabindex="-1">
      <button class="sopen" id="openSearch" aria-label="Search"></button>
    </div>
  </div>
</header>

<div class="spanel" id="spanel" aria-live="polite"><div class="wrap g" id="sresults"></div></div>

<main id="swup" class="transition-swup hide-scrollbar{{home}}" data-route="{{route}}" data-dept="{{dept}}" tabindex="-1"><!-- PAGE --></main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="menuSheet" role="dialog" aria-label="Menu" aria-modal="true">
  <div class="handle" aria-hidden="true"></div>
  <div class="sheet-body g" id="menuBody"></div>
</section>
<section class="sheet" id="filterSheet" role="dialog" aria-label="Filter" aria-modal="true">
  <div class="handle" aria-hidden="true"></div>
  <div class="g" style="height: 56px; display: flex; justify-content: space-between; align-items: center; flex: none;">
    <h2 style="font-size: var(--t22); font-weight: 500; letter-spacing: -.02em;">Filter</h2>
    <button class="link" id="resetFilter" style="height: 44px; font-size: var(--t14);">Reset</button>
  </div>
  <div class="sheet-body g" id="filterBody" style="border-top: 1px solid var(--ink); padding-bottom: 16px;"></div>
  <div class="g" style="padding-top: 12px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); flex: none;">
    <button class="btn fill wide sq" id="applyFilter">Show objects</button>
  </div>
</section>

</div>
<div id="route-status" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
