<main id="swup" class="transition-swup hide-scrollbar{{home}}" data-route="{{route}}" data-dept="{{dept}}" tabindex="-1"><!-- PAGE --></main>

<div class="scrim search-scrim" id="searchScrim" aria-hidden="true"></div>
<div class="scrim" id="scrim" aria-hidden="true"></div>

<section class="sheet" id="filterSheet" role="dialog" aria-label="Filter" aria-modal="true">
  <div class="handle" aria-hidden="true"></div>
  <div class="g" style="height: 56px; display: flex; justify-content: space-between; align-items: center; flex: none;">
    <h2 style="font-size: var(--t22); font-weight: 500; letter-spacing: -.02em;">Filter</h2>
    <button class="link" id="resetFilter" style="height: 44px; font-size: var(--t14);">Reset</button>
  </div>
  <div class="sheet-body g" id="filterBody" style="border-top: 1px solid var(--ink); padding-bottom: 16px;"></div>
  <div class="g" style="padding-top: 12px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); flex: none;">
    <button class="btn fill wide sq" id="applyFilter">Show objects</button>
  </div>
</section>

<!-- Persistent viewport edges, outside both Swup containers. -->
<div class="progressive-blur top-blur" aria-hidden="true">

  <div class="layer blur-2"></div>

</div>
